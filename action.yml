name: 'Verdict'
description: 'Multi-model adversarial security review: independent Claude + GPT-5.6 Sol reviewers plus Semgrep, never silently merged into a majority vote. Requires human review on any disagreement or high/critical finding.'
author: 'xKazeex'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key (BYOK -- supply your own as a repo secret; never proxied or custodied by Verdict).'
    required: true
  openai-api-key:
    description: 'OpenAI API key (BYOK -- supply your own as a repo secret; never proxied or custodied by Verdict).'
    required: true
  github-token:
    description: 'Token used only to post the PR comment and set the check status -- standard github.token, not a model API key.'
    required: true
    default: ${{ github.token }}
  config-path:
    description: 'Path to .verdict.yml relative to the repo root.'
    required: false
    default: '.verdict.yml'
  override-label:
    description: 'PR label that allows merging past a DISPUTED/NEEDS_HUMAN_REVIEW status once a human has actually reviewed it.'
    required: false
    default: 'verdict-override'

outputs:
  status:
    description: 'One of SKIPPED, BLOCKED_SECRETS_DETECTED, PASS, DISPUTED, NEEDS_HUMAN_REVIEW.'
  sarif-path:
    description: 'Path to the emitted SARIF file, for upload via github/codeql-action/upload-sarif.'

runs:
  using: 'node20'
  main: 'src/index.js'
