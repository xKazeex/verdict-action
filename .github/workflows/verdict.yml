name: Verdict

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verdict:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history), not the default shallow checkout -- buildSnapshot()
      # runs a real `git diff baseSha...headSha` and needs both commits actually present
      # locally, not just the PR's merge ref.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verdict runs the bundled rules/basic.yml ruleset locally (never --config auto), but
      # still needs the semgrep binary itself on PATH. Without this, Semgrep is reported as
      # an unavailable channel on every run and forces NEEDS_HUMAN_REVIEW regardless of
      # content -- see src/verdict.js's degraded-mode handling.
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Verdict
        uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
